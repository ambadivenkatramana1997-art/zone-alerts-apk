name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange project folders
   run: |
    mkdir -p app/src/main/java/com/zonealerts app/src/main

    mv MainActivity.java app/src/main/java/com/zonealerts/
    mv PollService.java app/src/main/java/com/zonealerts/
    mv AndroidManifest.xml app/src/main/
    mv app.gradle app/build.gradle
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ZoneAlerts-apk
          path: app/build/outputs/apk/debug/app-debug.apk
